name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    timeout-minutes: 10

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch --no-tags upstream main

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit --no-ff upstream/main; then
            echo "::error::Upstream merge conflict. Conflicted files:"
            git diff --name-only --diff-filter=U | while read -r file; do
              echo "::error file=${file}::Merge conflict with upstream/main"
            done
            git merge --abort || true
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push merged upstream changes
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Trigger CI/CD for synced main
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
