name: CI/CD - Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-server-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Miniflare test runtime
        run: npm install --include=dev --no-save --package-lock=false miniflare@3.20250718.3

      - name: Test runtime suite
        run: npm run test

      - name: Guard Durable Object WebSocket hibernation
        run: |
          if grep -nE 'server\.accept\(' src/durable/MetricsBroadcaster.js; then
            echo "::error::Durable Object must use state.acceptWebSocket() so Agent connections can hibernate."
            exit 1
          fi

      - name: Test agent configuration
        run: npm run test:agent-config

      - name: Test history queries
        run: npm run test:history-query

      - name: Build frontend
        run: npm run build:frontend

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://monitor.fyzure.fyi/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run build:frontend

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify production
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://monitor.fyzure.fyi/api/status \
            >/dev/null
