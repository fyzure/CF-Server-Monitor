name: CI/CD - Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-server-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Miniflare test runtime
        run: npm install --include=dev --no-save --package-lock=false miniflare@3.20250718.3

      - name: Test runtime suite
        run: npm run test

      - name: Guard Durable Object WebSocket hibernation
        run: |
          if grep -nE 'server\.accept\(' src/durable/MetricsBroadcaster.js; then
            echo "::error::Durable Object must use state.acceptWebSocket() so Agent connections can hibernate."
            exit 1
          fi

      - name: Test agent configuration
        run: npm run test:agent-config

      - name: Test history queries
        run: npm run test:history-query

      - name: Build frontend
        run: npm run build:frontend

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://monitor.fyzure.fyi/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run build:frontend

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('version.json', 'utf8')).workers)")

          config_ok=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --max-time 15 \
              "https://monitor.fyzure.fyi/api/config?health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              -o /tmp/cfsm-config.json \
              && jq -e --arg expected_version "$expected_version" '
                type == "object" and
                (.version == $expected_version) and
                (.is_public | type == "boolean")
              ' /tmp/cfsm-config.json >/dev/null; then
              config_ok=true
              break
            fi
            echo "Production config has not converged to ${expected_version} yet (attempt ${attempt}/12)."
            sleep 5
          done

          if [ "$config_ok" != true ]; then
            echo "::error::Production /api/config did not converge to expected version ${expected_version}."
            cat /tmp/cfsm-config.json || true
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://monitor.fyzure.fyi/api/servers \
            -o /tmp/cfsm-servers.json
          jq -e '
            type == "object" and
            (.servers | type == "array") and
            (.stats | type == "object") and
            (.stats.total | type == "number") and
            (.stats.online | type == "number")
          ' /tmp/cfsm-servers.json >/dev/null
